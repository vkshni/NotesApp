<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale=1.0">
    <title>NotesApp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Notes App</h1>

        <!-- Add note form -->
        <div class="note-form">
            <input id="text-input" type="text" placeholder="Enter title">
            <textarea id="content" placeholder="What's on your mind"></textarea>
            <button id="save-btn">Save Note</button>
        </div>
        <!-- Message box -->
        <div id="msg"></div>

        <h2>Recently Added</h2>

        <!-- Notes list -->
        <div id="notes-list">
        </div>

        <script src="app.js"></script>
    </div>
</body>

</html>
